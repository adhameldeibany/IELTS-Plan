<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg: #0c0c0f;
  --surface: #141418;
  --surface2: #1c1c22;
  --border: #252530;
  --text: #f0f0f5;
  --muted: #5a5a6e;
  --dim: #3a3a4a;
  --done: #10b981;
  --mock: #f97316;
  --analysis: #8b5cf6;
  --study: #06b6d4;
  --rest: #ec4899;
  --exam: #fbbf24;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  min-height: 100vh;
}

/* HEADER */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(12,12,15,0.95);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.top-bar h1 { font-size: 17px; font-weight: 900; flex: 1; }
.top-bar h1 span { color: var(--mock); }
.progress-ring-wrap { position: relative; width: 52px; height: 52px; flex-shrink: 0; }
.progress-ring-wrap svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--surface2); stroke-width: 3.5; }
.ring-fill { fill: none; stroke: var(--done); stroke-width: 3.5; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; color: var(--done); }
.days-left { text-align: center; }
.days-left-num { font-size: 20px; font-weight: 900; color: var(--exam); line-height: 1; }
.days-left-label { font-size: 10px; color: var(--muted); }

/* CALENDAR STRIP */
.cal-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
.cal-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
.cal-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.cal-scroll::-webkit-scrollbar { display: none; }
.cal-day {
  flex-shrink: 0;
  width: 46px;
  border-radius: 10px;
  padding: 7px 4px;
  text-align: center;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.cal-day:active { transform: scale(0.95); }
.cal-day.today { border-color: var(--study); background: rgba(6,182,212,0.1); }
.cal-day.done-day { border-color: var(--done); background: rgba(16,185,129,0.08); }
.cal-day.mock-day-cal { border-color: var(--mock); background: rgba(249,115,22,0.1); }
.cal-day.analysis-day-cal { border-color: var(--analysis); background: rgba(139,92,246,0.08); }
.cal-day.rest-day-cal { border-color: var(--rest); background: rgba(236,72,153,0.08); }
.cal-day.exam-day-cal { border-color: var(--exam); background: rgba(251,191,36,0.12); }
.cal-day.selected { box-shadow: 0 0 0 2px white; }
.cal-num { font-size: 14px; font-weight: 900; line-height: 1; }
.cal-dot { width: 5px; height: 5px; border-radius: 50%; margin: 4px auto 0; }
.cal-day-name { font-size: 9px; color: var(--muted); margin-top: 3px; }

/* TYPE COLORS */
.type-mock .cal-num { color: var(--mock); }
.type-analysis .cal-num { color: var(--analysis); }
.type-rest .cal-num, .type-exam .cal-num { color: var(--exam); }
.type-study .cal-num { color: var(--study); }

/* SELECTED DAY DETAIL */
.day-detail {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: none;
  animation: slideIn 0.2s ease;
}
.day-detail.visible { display: block; }
.detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.detail-badge {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; flex-shrink: 0;
}
.detail-info h3 { font-size: 15px; font-weight: 900; }
.detail-info p { font-size: 12px; color: var(--muted); }
.detail-tasks { display: flex; flex-direction: column; gap: 6px; }
.detail-task {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 9px 12px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px;
  font-size: 13px;
}
.detail-task-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.detail-task-text { flex: 1; }
.detail-task-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* FULL PLAN LIST */
.plan-section { padding: 16px 20px; }
.plan-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1px; margin-bottom: 10px; }
.week-group { margin-bottom: 16px; }
.week-title-bar {
  font-size: 11px; font-weight: 700; color: var(--muted);
  letter-spacing: 1px; padding: 6px 0; border-bottom: 1px solid var(--border);
  margin-bottom: 8px;

.plan-row {
  display: flex; gap: 10px; align-items: center;
  padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface);
  margin-bottom: 6px; cursor: pointer;

.plan-row:active { transform: scale(0.99); }
.plan-row.today-row { border-color: var(--study); }
.plan-row.done-row { opacity: 0.45; }
.plan-row.mock-row { border-color: rgba(249,115,22,0.35); }
.plan-row.analysis-row { border-color: rgba(139,92,246,0.3); }
.plan-row.rest-row { border-color: rgba(236,72,153,0.3); }
.plan-row.exam-row { border-color: var(--exam); background: rgba(251,191,36,0.05); }
.plan-day-num {
  width: 30px; height: 30px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; flex-shrink: 0;
  background: var(--surface2);

.plan-row.mock-row .plan-day-num { background: rgba(249,115,22,0.2); color: var(--mock); }
.plan-row.analysis-row .plan-day-num { background: rgba(139,92,246,0.2); color: var(--analysis); }
.plan-row.done-row .plan-day-num { background: rgba(16,185,129,0.2); color: var(--done); }
.plan-row.today-row .plan-day-num { background: rgba(6,182,212,0.2); color: var(--study); }
.plan-row.exam-row .plan-day-num { background: rgba(251,191,36,0.2); color: var(--exam); }
.plan-info { flex: 1; }
.plan-title { font-size: 13px; font-weight: 700; }
.plan-date { font-size: 11px; color: var(--muted); margin-top: 1px; }
.plan-type-tag { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; flex-shrink: 0; }
.plan-check { font-size: 16px; flex-shrink: 0; }

/* LEGEND */
.legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 16px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

@keyframes slideIn { from { opacity:0; transform: translateY(-8px); } to { opacity:1; transform: translateY(0); } }

@media (max-width: 400px) {
  .today-title { font-size: 19px; }
  .cal-day { width: 40px; }
}
</style>

function getDay(n) {
  const d = new Date(START);
  d.setDate(d.getDate() + n);
  return d;
}
function formatDate(d) {
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function todayIndex() {
  const now = new Date();
  now.setHours(0,0,0,0);
  const s = new Date(START); s.setHours(0,0,0,0);
  const diff = Math.floor((now - s) / 86400000);
  return Math.max(0, Math.min(diff, PLAN.length - 1));
}

// Storage helpers — localStorage so data persists after closing browser
function getStorage() {
  try {
    const raw = localStorage.getItem('ielts_v3');
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}
function setStorage(data) {
  try { localStorage.setItem('ielts_v3', JSON.stringify(data)); } catch {}
}

      const lib2 = taskLib[extraSection.key][getLevel(extraSection.band)];
      tasks.push(lib2[0]);
    }
    tasks.push({i:'📚', t:`Vocabulary: ${vocabTopics[Math.floor(Math.random()*vocabTopics.length)]} (25 كلمة)`, d:'', dur:'30 د'});
    return tasks;
  }

  if (dayNum === 1) {
    // Day 1: Heavy focus on weakest
    const lib = taskLib[weakest.key][getLevel(weakest.band)];
    return [
      {i:'🎯', t:`يوم مخصص لـ ${weakest.icon} ${weakest.name} — أضعف section`, d:`Band: ${weakest.band.toFixed(1)}`, dur:''},
      ...lib,
      {i:'📚', t:'Vocabulary: مراجعة + 20 كلمة جديدة', d:'', dur:'30 د'},
    ];
  } else if (dayNum === 2) {
    // Day 2: Weakest + second weakest
    return [
      {i:'⚡', t:`تعمق في ${weakest.icon} ${weakest.name} + ${second.icon} ${second.name}`, d:'', dur:''},
      ...buildDay(weakest, second, sections),
    ];
  } else {
    // Day 3: All sections review
    const allTasks = [{i:'🔄', t:'مراجعة شاملة — كل الـ sections', d:'بناءً على نتيجة الـ Mock', dur:''}];
    sections.forEach(s => {
      const lib = taskLib[s.key][getLevel(s.band)];
      allTasks.push(lib[0]);
    });
    allTasks.push({i:'📊', t:'راجع كل نتايج الـ Mock Tests السابقة', d:'شوف منحنى التقدم', dur:'30 د'});
    return allTasks;
  }
}

function clearAdaptivePlanForMock(mockIdx) {
  let studyDaysFound = 0;
  for (let i = mockIdx + 1; i < PLAN.length && studyDaysFound < 3; i++) {
    if (PLAN[i].type === 'study' || PLAN[i].type === 'analysis') {
      studyDaysFound++;
      // Only remove override if it was set by THIS mock
      try {
        const raw = localStorage.getItem(getOverrideKey(i));
        if (raw) {
          const saved = JSON.parse(raw);
          if (saved.mockIdx === mockIdx) {
            localStorage.removeItem(getOverrideKey(i));
          }
        }
      } catch {}
    }
  }
}

function applyAdaptivePlanToNextDays(mockIdx, sc) {
  // Find the 3 study days after this mock day
  let studyDaysFound = 0;
  for (let i = mockIdx + 1; i < PLAN.length && studyDaysFound < 3; i++) {
    if (PLAN[i].type === 'study' || PLAN[i].type === 'analysis') {
      studyDaysFound++;
      const tasks = getAdaptiveTasks(sc, studyDaysFound);
      if (tasks) {
        // Calculate weakest section name safely outside template literal
        let weakestName = 'الضعيف';
        if (studyDaysFound === 1) {
          const scoreVals = [
            {k:'L', v:toBand(sc.L,40)},
            {k:'R', v:toBand(sc.R,40)},
            {k:'W', v:sc.W ? parseFloat(sc.W) : null},
            {k:'S', v:sc.S ? parseFloat(sc.S) : null}
          ].filter(x => x.v !== null).sort((a, b) => a.v - b.v);
          if (scoreVals.length > 0) {
            const nameMap = {L:'Listening', R:'Reading', W:'Writing', S:'Speaking'};
            weakestName = nameMap[scoreVals[0].k] || 'الضعيف';
          }
        }

        const title = studyDaysFound === 1
          ? `🎯 خطة مخصصة — تقوية ${weakestName}`
          : studyDaysFound === 2 ? '⚡ تعمق + تنويع'
          : '🔄 مراجعة شاملة';

        try {
          localStorage.setItem(getOverrideKey(i), JSON.stringify({ title, tasks, mockIdx }));
        } catch {}
      }
    }
  }
}

function getDayOverride(dayIdx) {
  try {
    const raw = localStorage.getItem(getOverrideKey(dayIdx));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function getEffectiveDayData(dayIdx) {
  const override = getDayOverride(dayIdx);
  if (override) {
    return {
      type: PLAN[dayIdx].type,
      title: override.title,
      tasks: override.tasks,
      isOverridden: true,
      mockIdx: override.mockIdx,
    };
  }
  return { ...PLAN[dayIdx], isOverridden: false };
}

function getDayDoneCount(dayIdx) {
  const key = `d${dayIdx}`;
  return storage[key] ? storage[key].filter(Boolean).length : 0;
}
function getDayTotal(dayIdx) {
  return getEffectiveDayData(dayIdx).tasks.length;
}
function isTaskDone(dayIdx, taskIdx) {
  const key = `d${dayIdx}`;
  return storage[key] ? !!storage[key][taskIdx] : false;
}
function toggleTask(dayIdx, taskIdx) {
  const key = `d${dayIdx}`;
  if (!storage[key]) storage[key] = new Array(PLAN[dayIdx].tasks.length).fill(false);
  storage[key][taskIdx] = !storage[key][taskIdx];
  setStorage(storage);
}
function isDayDone(dayIdx) {
  const done = getDayDoneCount(dayIdx);
  const total = getDayTotal(dayIdx);
  return done >= total && total > 0;
}

// Count all completed days
function countDoneDays() {
  const tIdx = todayIndex();
  let count = 0;
  for (let i = 0; i < tIdx; i++) {
    if (isDayDone(i)) count++;
  }
  return count;
}

function getTypeColor(type) {
  switch(type) {
    case 'mock': return 'var(--mock)';
    case 'analysis': return 'var(--analysis)';
    case 'rest': return 'var(--rest)';
    case 'exam': return 'var(--exam)';
    default: return 'var(--study)';
  }
}
function getTypeLabel(type) {
  switch(type) {
    case 'mock': return 'Mock 🔥';
    case 'analysis': return 'تحليل 🔬';
    case 'rest': return 'راحة 😌';
    case 'exam': return 'امتحان 🏆';
    default: return 'دراسة 📚';
  }
}
function getMockNum(dayIdx) {
  // Day 0 is diagnostic mock (#0), rest count from 1
  if (dayIdx === 0) return 0;
  let count = 0;
  for (let i = 1; i <= dayIdx; i++) {
    if (PLAN[i].type === 'mock') count++;
  }
  return count;
}

function getMockLabel(dayIdx) {
  const num = getMockNum(dayIdx);
  return num === 0 ? 'Mock تشخيصي #0' : `Mock Test #${num}`;
}

function renderCalStrip() {
  const strip = document.getElementById('calStrip');
  const tIdx = todayIndex();
  let html = '';
  PLAN.forEach((day, i) => {
    const date = getDay(i);
    const isToday = i === tIdx;
    const isSel = selectedDay === i;
    const isMock = day.type === 'mock';
    const isAnalysis = day.type === 'analysis';
    const isRest = day.type === 'rest';
    const isExam = day.type === 'exam';
    const isDone = isDayDone(i) && i < tIdx;

    let cls = `cal-day type-${day.type}`;
    if (isToday) cls += ' today';
    else if (isDone) cls += ' done-day';
    else if (isMock) cls += ' mock-day-cal';
    else if (isAnalysis) cls += ' analysis-day-cal';
    else if (isRest) cls += ' rest-day-cal';
    else if (isExam) cls += ' exam-day-cal';
    if (isSel) cls += ' selected';

    const dotColor = isDone ? 'var(--done)' : getTypeColor(day.type);
    html += `
      <div class="${cls}" onclick="selectDay(${i})" id="cal_${i}">
        <div class="cal-num">${date.getDate()}</div>
        <div class="cal-dot" style="background:${dotColor}"></div>
        <div class="cal-day-name">${DAYS_NAMES[date.getDay()]}</div>
      </div>`;
  });
  strip.innerHTML = html;

  // Scroll to today
  setTimeout(() => {
    const el = document.getElementById(`cal_${tIdx}`);
    if (el) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  }, 100);
}

function toBand(raw, max) {
  if (raw === '' || raw === null || raw === undefined || isNaN(raw)) return null;
  const r = parseInt(raw);
  if (max === 40) {
    if (r >= 39) return 9.0; if (r >= 37) return 8.5; if (r >= 35) return 8.0;
    if (r >= 33) return 7.5; if (r >= 30) return 7.0; if (r >= 27) return 6.5;
    if (r >= 23) return 6.0; if (r >= 20) return 5.5; if (r >= 16) return 5.0;
    if (r >= 13) return 4.5; return 4.0;
  }
  return parseFloat(raw);
}

  const sBand = sc.S !== '' ? parseFloat(sc.S) : null;

  const fmt = (b) => b !== null ? b.toFixed(1) : '—';

  const vals = [lBand, rBand, wBand, sBand].filter(v=>v!==null);
  const overall = vals.length > 0 ? (Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2).toFixed(1) : '—';

  const adaptiveHtml = (vals.length >= 2) ? getAdaptivePlan(sc, mNum) : `
    <div style="margin-top:12px;padding:10px;background:rgba(139,92,246,0.06);border:1px dashed rgba(139,92,246,0.3);border-radius:10px;font-size:12px;color:var(--muted);text-align:center;">
      🤖 سجّل نتيجة Listening + Reading على الأقل عشان أولدلك خطة مخصصة
    </div>`;

  return `
  <div id="mockScoreBox_${idx}" style="margin-top:12px;background:rgba(249,115,22,0.06);border:1px solid rgba(249,115,22,0.25);border-radius:12px;padding:14px;">
    <div style="font-size:13px;font-weight:900;color:var(--mock);margin-bottom:12px;">📊 نتائج ${getMockLabel(idx)}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">🎧 LISTENING (/40)</div>
        <input id="mock_L_${idx}" type="number" min="0" max="40" placeholder="مثال: 32"
          value="${sc.L}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:var(--mock);" id="mock_L_band_${idx}">${fmt(lBand)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">📖 READING (/40)</div>
        <input id="mock_R_${idx}" type="number" min="0" max="40" placeholder="مثال: 29"
          value="${sc.R}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#06b6d4;" id="mock_R_band_${idx}">${fmt(rBand)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">✍️ WRITING (Band)</div>
        <input id="mock_W_${idx}" type="number" min="0" max="9" step="0.5" placeholder="مثال: 6.0"
          value="${sc.W}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#f59e0b;" id="mock_W_band_${idx}">${fmt(wBand)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">🗣️ SPEAKING (Band)</div>
        <input id="mock_S_${idx}" type="number" min="0" max="9" step="0.5" placeholder="مثال: 6.5"
          value="${sc.S}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#10b981;" id="mock_S_band_${idx}">${fmt(sBand)}</div>
      </div>
    </div>

    <div style="background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:10px;text-align:center;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Overall Band Score</div>
      <div id="mock_overall_${idx}" style="font-size:30px;font-weight:900;color:var(--mock);">${overall}</div>
    </div>

    <div style="margin-bottom:12px;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;">📝 ملاحظات + نقاط ضعف</div>
      <textarea id="mock_notes_${idx}" placeholder="اكتب هنا نقاط ضعفك ومش فاهم إيه..." oninput="updateMockScore(${idx})"
        style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;min-height:70px;outline:none;">${sc.notes}</textarea>
    </div>

    <div id="adaptivePlan_${idx}">${adaptiveHtml}</div>
  </div>`;
}

function updateMockScore(idx) {
  const L = document.getElementById(`mock_L_${idx}`)?.value || '';
  const R = document.getElementById(`mock_R_${idx}`)?.value || '';
  const W = document.getElementById(`mock_W_${idx}`)?.value || '';
  const S = document.getElementById(`mock_S_${idx}`)?.value || '';
  const notes = document.getElementById(`mock_notes_${idx}`)?.value || '';
  const sc = { L, R, W, S, notes };
  saveMockScore(idx, sc);

  const lB = toBand(L, 40);
  const rB = toBand(R, 40);
  const wB = W !== '' ? parseFloat(W) : null;
  const sB = S !== '' ? parseFloat(S) : null;
  const fmt = (b) => b !== null ? b.toFixed(1) : '—';

  const el = (id) => document.getElementById(id);
  if (el(`mock_L_band_${idx}`)) el(`mock_L_band_${idx}`).textContent = fmt(lB);
  if (el(`mock_R_band_${idx}`)) el(`mock_R_band_${idx}`).textContent = fmt(rB);
  if (el(`mock_W_band_${idx}`)) el(`mock_W_band_${idx}`).textContent = fmt(wB);
  if (el(`mock_S_band_${idx}`)) el(`mock_S_band_${idx}`).textContent = fmt(sB);

  const vals = [lB, rB, wB, sB].filter(v=>v!==null);
  const overall = vals.length > 0 ? (Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2).toFixed(1) : '—';
  if (el(`mock_overall_${idx}`)) el(`mock_overall_${idx}`).textContent = overall;

  // Apply or clear adaptive plan based on scores
  if (vals.length >= 2) {
    applyAdaptivePlanToNextDays(idx, sc);
    renderPlanList();
    if (selectedDay !== null && selectedDay !== idx) renderDayDetail(selectedDay);
  } else if (vals.length === 0) {
    clearAdaptivePlanForMock(idx);
    renderPlanList();
    if (selectedDay !== null && selectedDay !== idx) renderDayDetail(selectedDay);
  }
  // Update adaptive plan box inside mock scores if visible
  const adaptiveBox = el(`adaptivePlan_${idx}`);
  if (adaptiveBox) {
    adaptiveBox.innerHTML = vals.length >= 2
      ? getAdaptivePlan(sc, mNum)
      : `<div style="margin-top:12px;padding:10px;background:rgba(139,92,246,0.06);border:1px dashed rgba(139,92,246,0.3);border-radius:10px;font-size:12px;color:var(--muted);text-align:center;">🤖 سجّل نتيجة Listening + Reading على الأقل عشان أولدلك خطة مخصصة</div>`;
  }
}

function renderDayDetail(idx) {
  const day = getEffectiveDayData(idx);
  const date = getDay(idx);
  const detail = document.getElementById('dayDetail');
  const color = getTypeColor(day.type);
  const label = getTypeLabel(day.type);

  let icon = '📚';
  if (day.type==='mock') icon='🔥';
  if (day.type==='analysis') icon='🔬';
  if (day.type==='rest') icon='😌';
  if (day.type==='exam') icon='🏆';

  const doneCount = getDayDoneCount(idx);
  const total = getDayTotal(idx);

  let tasksHtml = day.tasks.map((t, i) => {
    const done = isTaskDone(idx, i);
    return `
    <div class="detail-task ${done?'detail-task-done':''}" onclick="toggleDetailTask(${idx},${i})" style="cursor:pointer;transition:all 0.2s;">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${done?color:'var(--dim)'};background:${done?color:'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;">
        <span style="font-size:12px;color:#000;opacity:${done?1:0};transition:opacity 0.2s;">✓</span>
      </div>
      <div class="detail-task-icon">${t.i}</div>
      <div class="detail-task-text" style="${done?'text-decoration:line-through;color:var(--muted)':''}">
        <div>${t.t}</div>
        ${t.d ? `<div class="detail-task-sub">${t.d}</div>` : ''}
      </div>
      ${t.dur ? `<div style="font-size:11px;color:var(--muted);flex-shrink:0">${t.dur}</div>` : ''}
    </div>`;
  }).join('');

  const overrideBadge = day.isOverridden
    ? `<div style="margin-bottom:10px;padding:7px 12px;background:rgba(139,92,246,0.12);border:1px solid rgba(139,92,246,0.35);border-radius:8px;font-size:11px;color:#a78bfa;font-weight:700;">🤖 خطة مخصصة بناءً على نتيجة Mock السابق</div>`
    : '';

  const mockScoresHtml = day.type === 'mock' ? renderMockScores(idx) : '';

  detail.innerHTML = `
    <div class="detail-header">
      <div class="detail-badge" style="background:${color}20;color:${color};border:1px solid ${color}40">${icon}</div>
      <div class="detail-info">
        <h3>يوم ${date.getDate()}: ${day.title}</h3>
        <p>${DAYS_NAMES[date.getDay()]} ${formatDate(date)} • ${label} • ${doneCount}/${total} ✓</p>
      </div>
    </div>
    ${overrideBadge}
    <div class="detail-tasks">${tasksHtml}</div>
    ${mockScoresHtml}`;
  detail.classList.add('visible');
  detail.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function toggleDetailTask(dayIdx, taskIdx) {
  toggleTask(dayIdx, taskIdx);
  renderDayDetail(dayIdx);
  renderCalStrip();
  renderProgress();
  renderPlanList();
  // also re-render today if it's today
  if (dayIdx === todayIndex()) renderToday();
}

// =====================
// PROGRESS
// =====================
function getTotalTasks() {
  return PLAN.reduce((sum, day) => sum + day.tasks.length, 0);
}
function getCompletedTasks() {
  let count = 0;
  PLAN.forEach((day, i) => {
    day.tasks.forEach((_, j) => {
      if (isTaskDone(i, j)) count++;
    });
  });
  return count;
}

function getDaysLeft() {
  const now = new Date();
  const examD = new Date(EXAM_DATE);
  // Set exam to start of day
  examD.setHours(0,0,0,0);
  now.setHours(0,0,0,0);
  const diff = Math.ceil((examD - now) / 86400000);
  return Math.max(0, diff);
}

function renderProgress() {
  const completed = getCompletedTasks();
  const total = getTotalTasks();
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;

  const circumference = 2 * Math.PI * 22; // r=22
  const offset = circumference * (1 - pct / 100);
  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringNum').textContent = pct + '%';

  document.getElementById('daysLeft').textContent = getDaysLeft();
}

// Update days left counter every minute (midnight roll-over)
setInterval(() => {
  document.getElementById('daysLeft').textContent = getDaysLeft();
}, 60000);

// =====================
// FULL PLAN LIST
// =====================
function renderPlanList() {
  const tIdx = todayIndex();
  const container = document.getElementById('planList');
  let html = '';
  let weekNum = 0;

  PLAN.forEach((day, i) => {
    if (i % 7 === 0) {
      weekNum++;
      const wStart = formatDate(getDay(i));
      const wEnd = formatDate(getDay(Math.min(i+6, PLAN.length-1)));
      if (i > 0) html += '</div>';
      html += `<div class="week-group"><div class="week-title-bar">الأسبوع ${weekNum} — ${wStart} → ${wEnd}</div>`;
    }

    const date = getDay(i);
    const effectiveDay = getEffectiveDayData(i);
    const isToday = i === tIdx;
    const isDone = isDayDone(i) && i < tIdx;
    const doneCount = getDayDoneCount(i);
    const total = getDayTotal(i);

    let cls = 'plan-row';
    if (isToday) cls += ' today-row';
    else if (isDone) cls += ' done-row';
    if (effectiveDay.type==='mock') cls += ' mock-row';
    if (effectiveDay.type==='analysis') cls += ' analysis-row';
    if (effectiveDay.type==='rest') cls += ' rest-row';
    if (effectiveDay.type==='exam') cls += ' exam-row';

    const color = getTypeColor(effectiveDay.type);
    const check = isDone ? '✅' : (isToday ? '👉' : (doneCount > 0 ? `${doneCount}/${total}` : ''));
    const tagBg = `${color}20`;
    const overrideIcon = effectiveDay.isOverridden ? '🤖 ' : '';

    html += `
      <div class="${cls}" onclick="selectDay(${i})">
        <div class="plan-day-num">${date.getDate()}</div>
        <div class="plan-info">
          <div class="plan-title">${overrideIcon}${effectiveDay.title}</div>
          <div class="plan-date">${DAYS_NAMES[date.getDay()]} ${formatDate(date)} ${isToday?'← اليوم':''}</div>
        </div>
        <span class="plan-type-tag" style="background:${tagBg};color:${color};border:1px solid ${color}30">
          ${getTypeLabel(effectiveDay.type)}
        </span>
        <div class="plan-check">${check}</div>
      </div>`;
  });

  html += '</div>';
  container.innerHTML = html;
}

// =====================
// INIT
// =====================
function init() {
  try {
    // Reapply or clear adaptive plans from saved mock scores on load
    PLAN.forEach((day, i) => {
      if (day.type === 'mock') {
        try {
          const sc = getMockScore(i);
          const vals = [toBand(sc.L,40), toBand(sc.R,40), sc.W?parseFloat(sc.W):null, sc.S?parseFloat(sc.S):null].filter(v=>v!==null);
          if (vals.length >= 2) {
            applyAdaptivePlanToNextDays(i, sc);
          } else if (vals.length === 0) {
            clearAdaptivePlanForMock(i);
          }
        } catch(e) {}
      }
    });
    renderProgress();
    renderCalStrip();
    renderPlanList();
    // Auto-select today
    selectDay(todayIndex());
  } catch(e) {
    console.log('Init error:', e.message);
  }
}

init();
</script>
</body>
</html>
