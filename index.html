<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan for Ielts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0c0c0f;
  --surface: #141418;
  --surface2: #1c1c22;
  --border: #252530;
  --text: #f0f0f5;
  --muted: #5a5a6e;
  --dim: #3a3a4a;
  --done: #10b981;
  --mock: #f97316;
  --analysis: #8b5cf6;
  --study: #06b6d4;
  --rest: #ec4899;
  --exam: #fbbf24;
}
body { background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; }

/* TOP BAR */
.top-bar {
  position:sticky; top:0; z-index:100;
  background:rgba(12,12,15,0.96); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:12px 16px; display:flex; align-items:center; gap:12px;
}
.top-bar h1 { font-size:16px; font-weight:900; flex:1; }
.top-bar h1 span { color:var(--mock); }
.days-left { text-align:center; flex-shrink:0; }
.days-left-num { font-size:22px; font-weight:900; color:var(--exam); line-height:1; }
.days-left-label { font-size:10px; color:var(--muted); }
.divider { width:1px; height:36px; background:var(--border); flex-shrink:0; }
.progress-ring-wrap { position:relative; width:52px; height:52px; flex-shrink:0; }
.progress-ring-wrap svg { transform:rotate(-90deg); }
.ring-bg { fill:none; stroke:var(--surface2); stroke-width:3.5; }
.ring-fill { fill:none; stroke:var(--done); stroke-width:3.5; stroke-linecap:round; transition:stroke-dashoffset 1s ease; }
.ring-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:var(--done); }

/* CALENDAR */
.cal-section { padding:14px 16px; border-bottom:1px solid var(--border); }
.cal-label { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:1px; margin-bottom:10px; }
.cal-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.cal-scroll::-webkit-scrollbar { display:none; }
.cal-day {
  flex-shrink:0; width:46px; border-radius:10px; padding:7px 4px;
  text-align:center; cursor:pointer; border:1px solid var(--border);
  background:var(--surface); transition:all 0.15s; -webkit-tap-highlight-color:transparent;
}
.cal-day:active { transform:scale(0.95); }
.cal-day.today { border-color:var(--study); background:rgba(6,182,212,0.1); }
.cal-day.done-day { border-color:var(--done); background:rgba(16,185,129,0.08); }
.cal-day.mock-day-cal { border-color:var(--mock); background:rgba(249,115,22,0.1); }
.cal-day.rest-day-cal { border-color:var(--rest); background:rgba(236,72,153,0.08); }
.cal-day.exam-day-cal { border-color:var(--exam); background:rgba(251,191,36,0.12); }
.cal-day.selected { box-shadow:0 0 0 2px white; }
.cal-day.missed-day { border-color:#ef4444; background:rgba(239,68,68,0.08); }
.cal-day.missed-day .cal-num { color:#ef4444; }
.cal-num { font-size:14px; font-weight:900; line-height:1; }
.cal-dot { width:5px; height:5px; border-radius:50%; margin:4px auto 0; }
.cal-day-name { font-size:9px; color:var(--muted); margin-top:3px; }
.type-mock .cal-num { color:var(--mock); }
.type-rest .cal-num, .type-exam .cal-num { color:var(--exam); }

/* DAY DETAIL */
.day-detail { padding:14px 16px; border-bottom:1px solid var(--border); display:none; animation:slideIn 0.2s ease; }
.day-detail.visible { display:block; }
.detail-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.detail-badge { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; flex-shrink:0; }
.detail-info h3 { font-size:15px; font-weight:900; }
.detail-info p { font-size:12px; color:var(--muted); }
.detail-tasks { display:flex; flex-direction:column; gap:6px; }
.detail-task {
  display:flex; gap:10px; align-items:flex-start;
  padding:9px 12px; background:var(--surface);
  border:1px solid var(--border); border-radius:10px;
  font-size:13px; cursor:pointer; transition:all 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.detail-task.detail-task-done { border-color:var(--done) !important; background:rgba(16,185,129,0.06); }
.detail-task-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.detail-task-text { flex:1; }
.detail-task-sub { font-size:11px; color:var(--muted); margin-top:2px; }

/* LEGEND */
.legend { display:flex; flex-direction:column; gap:6px; padding:10px 16px; }
.legend-item { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
.legend-dot { width:11px; height:11px; border-radius:50%; }

/* PLAN LIST */
.plan-section { padding:14px 16px; }
.plan-label { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:1px; margin-bottom:10px; }
.week-group { margin-bottom:14px; }
.week-title-bar { font-size:11px; font-weight:700; color:var(--muted); letter-spacing:1px; padding:6px 0; border-bottom:1px solid var(--border); margin-bottom:8px; }
.plan-row {
  display:flex; gap:10px; align-items:center;
  padding:10px 12px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface);
  margin-bottom:6px; cursor:pointer;
  transition:all 0.15s; -webkit-tap-highlight-color:transparent;
}
.plan-row:active { transform:scale(0.99); }
.plan-row.today-row { border-color:var(--study); }
.plan-row.done-row { border-color:var(--done) !important; background:rgba(16,185,129,0.06); }
.plan-row.mock-row { border-color:rgba(249,115,22,0.35); }
.plan-row.rest-row { border-color:rgba(236,72,153,0.3); }
.plan-row.exam-row { border-color:var(--exam); background:rgba(251,191,36,0.05); }
.plan-day-num { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; flex-shrink:0; background:var(--surface2); }
.plan-row.mock-row .plan-day-num { background:rgba(249,115,22,0.2); color:var(--mock); }
.plan-row.done-row .plan-day-num { background:rgba(16,185,129,0.2); color:var(--done); }
.plan-row.today-row .plan-day-num { background:rgba(6,182,212,0.2); color:var(--study); }
.plan-row.exam-row .plan-day-num { background:rgba(251,191,36,0.2); color:var(--exam); }
.plan-row.missed-row { border-color:#ef4444 !important; background:rgba(239,68,68,0.06); }
.plan-row.missed-row .plan-day-num { background:rgba(239,68,68,0.2); color:#ef4444; }
.plan-info { flex:1; }
.plan-title { font-size:15px; font-weight:700; }
.plan-date { font-size:13px; color:var(--muted); margin-top:1px; }
.plan-type-tag { font-size:10px; padding:2px 7px; border-radius:5px; font-weight:700; flex-shrink:0; }
.plan-check { font-size:16px; flex-shrink:0; }

@keyframes slideIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
@media (max-width:400px) { .cal-day { width:40px; } }
</style>
</head>
<body>

<div class="top-bar">
  <div style="flex:1">
    <h1>Plan for <span>IELTS</span></h1>
    <div style="font-size:11px;color:var(--muted);margin-top:2px;">13 يوليو → 22 أغسطس 2026</div>
  </div>
  <div class="days-left">
    <div class="days-left-num" id="daysLeft">57</div>
    <div class="days-left-label">يوم متبقي</div>
  </div>
  <div class="divider"></div>
  <div class="progress-ring-wrap">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <circle class="ring-bg" cx="26" cy="26" r="22"/>
      <circle class="ring-fill" cx="26" cy="26" r="22" id="ringFill"
        stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
    </svg>
    <div class="ring-num" id="ringNum">0%</div>
  </div>
</div>

<div class="cal-section">
  <div class="cal-label">التقويم — اضغط يوم لتفاصيله</div>
  <div class="cal-scroll" id="calStrip"></div>
</div>

<div class="day-detail" id="dayDetail"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--study)"></div>اليوم الحالي</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--mock)"></div>اليوم القادم</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--done)"></div>منتهي</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>فات ولم يكمل</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--exam)"></div>يوم الامتحان</div>
</div>

<div class="plan-section">
  <div class="plan-label">الخطة الكاملة — كل الأيام</div>
  <div id="planList"></div>
</div>

<div style="height:40px"></div>

<script>
const START     = new Date('2026-07-13');
const EXAM_DATE = new Date('2026-08-22');

// Cambridge books: 8 to 20, each has 4 tests = 52 tests total
const CAMBRIDGE_BOOKS = [
  'Cambridge 9 Test 1','Cambridge 9 Test 2','Cambridge 9 Test 3','Cambridge 9 Test 4',
  'Cambridge 10 Test 1','Cambridge 10 Test 2','Cambridge 10 Test 3','Cambridge 10 Test 4',
  'Cambridge 21 Test 1','Cambridge 21 Test 2','Cambridge 21 Test 3','Cambridge 21 Test 4',
  'Cambridge 20 Test 1','Cambridge 20 Test 2','Cambridge 20 Test 3','Cambridge 20 Test 4',
  'Cambridge 19 Test 1','Cambridge 19 Test 2','Cambridge 19 Test 3','Cambridge 19 Test 4',
  'Cambridge 18 Test 1','Cambridge 18 Test 2','Cambridge 18 Test 3','Cambridge 18 Test 4',
  'Cambridge 17 Test 1','Cambridge 17 Test 2','Cambridge 17 Test 3','Cambridge 17 Test 4',
  'Cambridge 16 Test 1','Cambridge 16 Test 2','Cambridge 16 Test 3','Cambridge 16 Test 4',
  'Cambridge 15 Test 1','Cambridge 15 Test 2','Cambridge 15 Test 3','Cambridge 15 Test 4',
  'Cambridge 14 Test 1','Cambridge 14 Test 2','Cambridge 14 Test 3','Cambridge 14 Test 4',
  'Cambridge 13 Test 1','Cambridge 13 Test 2','Cambridge 13 Test 3','Cambridge 13 Test 4',
  'Cambridge 12 Test 1','Cambridge 12 Test 2','Cambridge 12 Test 3','Cambridge 12 Test 4',
  'Cambridge 11 Test 1','Cambridge 11 Test 2','Cambridge 11 Test 3','Cambridge 11 Test 4',
];

const VOCAB_TOPICS = [
  'Education & Work','Environment','Technology','Health & Medicine',
  'Society & Culture','Economy & Business','Global Issues','Science',
  'Media & Communication','Law & Justice','Arts & Literature','Sports & Leisure',
  'Travel & Tourism','Food & Nutrition','Family & Relationships','Politics & Government',
  'Urban Life','Nature & Wildlife','Psychology','History',
];

function buildMockDay(dayIndex) {
  const book = CAMBRIDGE_BOOKS[Math.min(dayIndex, CAMBRIDGE_BOOKS.length - 1)];
  const vocab = VOCAB_TOPICS[dayIndex % VOCAB_TOPICS.length];
  const mockNum = dayIndex + 1;
  const writingDesc = dayIndex % 2 === 0
    ? 'Task 2 (60 د) + Task 1 (30 د)'
    : 'Task 2 فقط (90 د) — ركّز على Structure والأمثلة';
  return {
    type: 'mock',
    title: `Mock Test #${mockNum}`,
    tasks: [
      {i:'🎧', t:'Listening — 40 دقيقة + مراجعة أخطاء', d:`${book} — بعد ما تخلص صحح وحلل كل سؤال غلطت فيه وسجّله في Error Notebook`, dur:'ساعة ونص'},
      {i:'📖', t:'Reading — 60 دقيقة + مراجعة أخطاء', d:'3 passages — 20 دقيقة كل واحدة — بعد ما تخلص راجع كل إجابة غلط وافهم ليه', dur:'ساعتين'},
      {i:'✍️', t:'Writing — Task', d:'اكتب Task 1 (20 دقيقة) أو Task 2 (40 دقيقة) حسب ما تقرر — بعد ما تخلص راجع وصحح الأخطاء اللغوية والهيكل', dur:'ساعتين'},
      {i:'🗣️', t:'Speaking + Shadowing', d:'Part 1 + 2 + 3 كاملين (11-14 دقيقة في الامتحان) — سجّل صوتك واسمعه — بعدين كرر بعد المتكلم بنفس النبرة والسرعة 20 دقيقة', dur:'ساعتين ونص'},
      {i:'📚', t:`Vocabulary: ${vocab} — 10-15 كلمة`, d:'اكتب جملة على كل كلمة — Anki أو ورقة وقلم', dur:'15-20 د'},
    ]
  };
}


// Build full plan: mock days up to exam date, then exam day
function buildPlan() {
  const plan = [];
  const s = new Date(START); s.setHours(0,0,0,0);
  const e = new Date(EXAM_DATE); e.setHours(0,0,0,0);
  const TOTAL_MOCKS = Math.floor((e - s) / 86400000);
  for (let i = 0; i < TOTAL_MOCKS; i++) {
    plan.push(buildMockDay(i));
  }
  // Exam day always lands on EXAM_DATE
  plan.push({
    type: 'exam',
    title: '🏆 يوم الامتحان 🏆',
    tasks: [
      {i:'🏆', t:'هدف: 6.5 – 7.0 بإذن الله', d:'', dur:''},
    ]
  });
  return plan;
}

const PLAN = buildPlan();

const DAYS_NAMES = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

function getDay(n) { const d=new Date(START); d.setDate(d.getDate()+n); return d; }
function formatDate(d) { return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function todayIndex() {
  const now=new Date(); now.setHours(0,0,0,0);
  const s=new Date(START); s.setHours(0,0,0,0);
  const diff=Math.floor((now-s)/86400000);
  return Math.max(0,Math.min(diff,PLAN.length-1));
}

// Storage — GitHub Gist sync
const GIST_TOKEN_KEY = 'ielts_gh_token';
const GIST_ID_KEY    = 'ielts_gist_id';
const GIST_FILENAME  = 'ielts_plan_data.json';

function getToken() { return localStorage.getItem(GIST_TOKEN_KEY)||''; }
function getGistId() { return localStorage.getItem(GIST_ID_KEY)||''; }

function getStorage() { try { const r=localStorage.getItem('ielts_v3'); return r?JSON.parse(r):{}; } catch{return{}; } }
function setStorage(data) { try{localStorage.setItem('ielts_v3',JSON.stringify(data));}catch{} syncToGist(data); }

async function syncToGist(data) {
  const token=getToken(); if(!token) return;
  const gistId=getGistId();
  const body={files:{[GIST_FILENAME]:{content:JSON.stringify(data)}}};
  try {
    if(gistId) {
      await fetch(`https://api.github.com/gists/${gistId}`,{method:'PATCH',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
    } else {
      const r=await fetch('https://api.github.com/gists',{method:'POST',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({...body,public:false})});
      const j=await r.json();
      if(j.id) localStorage.setItem(GIST_ID_KEY,j.id);
    }
  } catch(e){}
}

async function loadFromGist() {
  const token=getToken(); if(!token) return;
  const gistId=getGistId(); if(!gistId) return;
  try {
    const r=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{'Authorization':`token ${token}`}});
    const j=await r.json();
    const file=j.files&&j.files[GIST_FILENAME];
    if(file&&file.content) {
      const data=JSON.parse(file.content);
      localStorage.setItem('ielts_v3',JSON.stringify(data));
      storage=data;
      renderAll();
    }
  } catch(e){}
}

function renderAll() { renderCalStrip(); renderPlanList(); if(selectedDay!==null) renderDetail(selectedDay); }

let storage = getStorage();
let selectedDay = null;

// Token setup modal
function showTokenModal() {
  document.getElementById('token-modal').style.display='flex';
}
function saveToken() {
  const t=document.getElementById('token-input').value.trim();
  if(!t) return;
  localStorage.setItem(GIST_TOKEN_KEY,t);
  document.getElementById('token-modal').style.display='none';
  loadFromGist();
}
window.addEventListener('load',()=>{
  if(!getToken()) showTokenModal();
  else loadFromGist();
});

function getDayDoneCount(i) { const k=`d${i}`; return storage[k]?storage[k].filter(Boolean).length:0; }
function getDayTotal(i) { return PLAN[i].tasks.length; }
function isTaskDone(i,j) { const k=`d${i}`; return storage[k]?!!storage[k][j]:false; }
function toggleTask(i,j) {
  const k=`d${i}`;
  if(!storage[k]) storage[k]=new Array(PLAN[i].tasks.length).fill(false);
  storage[k][j]=!storage[k][j];
  setStorage(storage);
}
function hasMockScore(i) {
  if(PLAN[i].type!=='mock') return true;
  const sc=getMockScore(i);
  return sc.L!==''&&sc.R!==''&&sc.W!==''&&sc.S!=='';
}
function isDayDone(i) { return getDayDoneCount(i)>=getDayTotal(i)&&getDayTotal(i)>0&&hasMockScore(i); }
function isMissedDay(i) {
  const tIdx=todayIndex();
  return i<tIdx && !isDayDone(i);
}

// Mock scores
function getMockScoreKey(i) { return `mock_score_${i}`; }
function getMockScore(i) {
  const s=getStorage(); return s[getMockScoreKey(i)]||{L:'',R:'',W:'',S:'',notes:''};
}
function saveMockScore(i,data) {
  const s=getStorage(); s[getMockScoreKey(i)]=data; setStorage(s); storage=s;
}

function toBand(raw,max) {
  if(raw===''||raw===null||raw===undefined||isNaN(raw)) return null;
  const r=parseInt(raw);
  if(max===40){
    if(r>=39)return 9.0;if(r>=37)return 8.5;if(r>=35)return 8.0;
    if(r>=33)return 7.5;if(r>=30)return 7.0;if(r>=27)return 6.5;
    if(r>=23)return 6.0;if(r>=20)return 5.5;if(r>=16)return 5.0;
    if(r>=13)return 4.5;return 4.0;
  }
  return parseFloat(raw);
}

function getTypeColor(type) {
  switch(type){case'mock':return'var(--mock)';case'rest':return'var(--rest)';case'exam':return'var(--exam)';default:return'var(--study)';}
}

function getTotalTasks() { return PLAN.reduce((s,d)=>s+d.tasks.length,0); }
function getCompletedTasks() {
  let c=0;
  PLAN.forEach((_,i)=>{ PLAN[i].tasks.forEach((_,j)=>{ if(isTaskDone(i,j))c++; }); });
  return c;
}

function getDaysLeft() {
  const now=new Date(); const e=new Date(EXAM_DATE);
  now.setHours(0,0,0,0); e.setHours(0,0,0,0);
  return Math.max(0,Math.ceil((e-now)/86400000));
}

function renderProgress() {
  const pct=getTotalTasks()>0?Math.round((getCompletedTasks()/getTotalTasks())*100):0;
  const c=2*Math.PI*22;
  document.getElementById('ringFill').style.strokeDashoffset=c*(1-pct/100);
  document.getElementById('ringNum').textContent=pct+'%';
  document.getElementById('daysLeft').textContent=getDaysLeft();
}
setInterval(()=>{ document.getElementById('daysLeft').textContent=getDaysLeft(); },60000);

// Mock scores UI
function renderMockScores(idx) {
  const sc=getMockScore(idx);
  const lB=toBand(sc.L,40), rB=toBand(sc.R,40);
  const wB=sc.W!==''?parseFloat(sc.W):null;
  const sB=sc.S!==''?parseFloat(sc.S):null;
  const fmt=(b)=>b!==null?b.toFixed(1):'—';
  const vals=[lB,rB,wB,sB].filter(v=>v!==null);
  const overall=vals.length>0?(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2).toFixed(1):'—';

  return `
  <div id="mockScoreBox_${idx}" style="margin-top:12px;background:rgba(249,115,22,0.06);border:1px solid rgba(249,115,22,0.25);border-radius:12px;padding:14px;">
    <div style="font-size:13px;font-weight:900;color:var(--mock);margin-bottom:12px;">📊 نتائج Mock Test #${idx+1}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">🎧 LISTENING (/40)</div>
        <input id="mock_L_${idx}" type="number" min="0" max="40" placeholder="مثال: 32" value="${sc.L}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:var(--mock);" id="mock_L_band_${idx}">${fmt(lB)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">📖 READING (/40)</div>
        <input id="mock_R_${idx}" type="number" min="0" max="40" placeholder="مثال: 29" value="${sc.R}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#06b6d4;" id="mock_R_band_${idx}">${fmt(rB)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">✍️ WRITING (Band)</div>
        <input id="mock_W_${idx}" type="number" min="0" max="9" step="0.5" placeholder="مثال: 6.0" value="${sc.W}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#f59e0b;" id="mock_W_band_${idx}">${fmt(wB)}</div>
      </div>
      <div style="background:var(--surface2);border-radius:10px;padding:10px;">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;font-weight:700;">🗣️ SPEAKING (Band)</div>
        <input id="mock_S_${idx}" type="number" min="0" max="9" step="0.5" placeholder="مثال: 6.5" value="${sc.S}" oninput="updateMockScore(${idx})"
          style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:7px 10px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:15px;font-weight:700;text-align:center;outline:none;">
        <div style="text-align:center;margin-top:5px;font-size:18px;font-weight:900;color:#10b981;" id="mock_S_band_${idx}">${fmt(sB)}</div>
      </div>
    </div>
    <div style="background:var(--surface2);border-radius:10px;padding:10px;margin-bottom:10px;text-align:center;">
      <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Overall Band Score</div>
      <div id="mock_overall_${idx}" style="font-size:30px;font-weight:900;color:var(--mock);">${overall}</div>
    </div>
    <div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:5px;font-weight:700;">📝 ملاحظات + نقاط ضعف</div>
      <textarea id="mock_notes_${idx}" placeholder="اكتب هنا نقاط ضعفك..." oninput="updateMockScore(${idx})"
        style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:13px;resize:vertical;min-height:60px;outline:none;">${sc.notes}</textarea>
    </div>
  </div>`;
}

function updateMockScore(idx) {
  const L=document.getElementById(`mock_L_${idx}`)?.value||'';
  const R=document.getElementById(`mock_R_${idx}`)?.value||'';
  const W=document.getElementById(`mock_W_${idx}`)?.value||'';
  const S=document.getElementById(`mock_S_${idx}`)?.value||'';
  const notes=document.getElementById(`mock_notes_${idx}`)?.value||'';
  saveMockScore(idx,{L,R,W,S,notes});
  renderCalStrip();
  renderPlanList();
  const lB=toBand(L,40),rB=toBand(R,40);
  const wB=W!==''?parseFloat(W):null, sB=S!==''?parseFloat(S):null;
  const fmt=(b)=>b!==null?b.toFixed(1):'—';
  const el=(id)=>document.getElementById(id);
  if(el(`mock_L_band_${idx}`))el(`mock_L_band_${idx}`).textContent=fmt(lB);
  if(el(`mock_R_band_${idx}`))el(`mock_R_band_${idx}`).textContent=fmt(rB);
  if(el(`mock_W_band_${idx}`))el(`mock_W_band_${idx}`).textContent=fmt(wB);
  if(el(`mock_S_band_${idx}`))el(`mock_S_band_${idx}`).textContent=fmt(sB);
  const vals=[lB,rB,wB,sB].filter(v=>v!==null);
  const overall=vals.length>0?(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*2)/2).toFixed(1):'—';
  if(el(`mock_overall_${idx}`))el(`mock_overall_${idx}`).textContent=overall;
  renderProgress();
}

// Calendar
function renderCalStrip() {
  const strip=document.getElementById('calStrip');
  const tIdx=todayIndex();
  let html='';
  PLAN.forEach((day,i)=>{
    const date=getDay(i);
    const isToday=i===tIdx;
    const isDone=isDayDone(i);
    const isSel=selectedDay===i;
    let cls=`cal-day type-${day.type}`;
    const isMissed=isMissedDay(i);
    if(isToday)cls+=' today';
    else if(isDone)cls+=' done-day';
    else if(isMissed)cls+=' missed-day';
    else if(day.type==='mock')cls+=' mock-day-cal';
    else if(day.type==='rest')cls+=' rest-day-cal';
    else if(day.type==='exam')cls+=' exam-day-cal';
    if(isSel)cls+=' selected';
    const dotColor=isDone?'var(--done)':isMissed?'#ef4444':getTypeColor(day.type);
    html+=`<div class="${cls}" onclick="selectDay(${i})" id="cal_${i}">
      <div class="cal-num">${date.getDate()}</div>
      <div class="cal-dot" style="background:${dotColor}"></div>
      <div class="cal-day-name">${DAYS_NAMES[date.getDay()]}</div>
    </div>`;
  });
  strip.innerHTML=html;
  setTimeout(()=>{ const el=document.getElementById(`cal_${tIdx}`); if(el)el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); },100);
}

function selectDay(idx) {
  if(selectedDay===idx){ selectedDay=null; document.getElementById('dayDetail').classList.remove('visible'); renderCalStrip(); return; }
  selectedDay=idx; renderCalStrip(); renderDayDetail(idx);
}

function renderDayDetail(idx) {
  const day=PLAN[idx];
  const date=getDay(idx);
  const detail=document.getElementById('dayDetail');
  const color=getTypeColor(day.type);
  const doneCount=getDayDoneCount(idx);
  const total=getDayTotal(idx);
  let icon='🔥';
  if(day.type==='rest')icon='😌';
  if(day.type==='exam')icon='🏆';

  let tasksHtml=day.tasks.map((t,i)=>{
    const done=isTaskDone(idx,i);
    return `<div class="detail-task ${done?'detail-task-done':''}" onclick="toggleDetailTask(${idx},${i})" style="opacity:${done?0.5:1}">
      <div style="width:22px;height:22px;border-radius:50%;border:2px solid ${done?'var(--done)':'var(--dim)'};background:${done?'var(--done)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;">
        <span style="font-size:12px;color:#000;opacity:${done?1:0};">✓</span>
      </div>
      <div class="detail-task-icon">${t.i}</div>
      <div class="detail-task-text" style="${done?'text-decoration:line-through;color:var(--muted)':''}">
        <div>${t.t}</div>
        ${t.d?`<div class="detail-task-sub">${t.d}</div>`:''}
      </div>
      ${t.dur?`<div style="font-size:11px;color:var(--muted);flex-shrink:0">${t.dur}</div>`:''}
    </div>`;
  }).join('');

  const mockScoresHtml=day.type==='mock'?renderMockScores(idx):'';

  detail.innerHTML=`
    <div class="detail-header">
      <div class="detail-badge" style="background:${color}20;color:${color};border:1px solid ${color}40">${icon}</div>
      <div class="detail-info">
        <h3>يوم ${date.getDate()}: ${day.title}</h3>
        <p>${DAYS_NAMES[date.getDay()]} ${formatDate(date)} • ${doneCount}/${total} ✓</p>
      </div>
    </div>
    <div class="detail-tasks">${tasksHtml}</div>
    ${mockScoresHtml}`;
  detail.classList.add('visible');
  detail.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function toggleDetailTask(dayIdx,taskIdx) {
  toggleTask(dayIdx,taskIdx);
  renderDayDetail(dayIdx);
  renderCalStrip();
  renderProgress();
  renderPlanList();
}

// Plan list
function renderPlanList() {
  const tIdx=todayIndex();
  const container=document.getElementById('planList');
  let html=''; let weekNum=0;
  PLAN.forEach((day,i)=>{
    if(i%7===0){
      weekNum++;
      const wStart=formatDate(getDay(i));
      const wEnd=formatDate(getDay(Math.min(i+6,PLAN.length-1)));
      if(i>0)html+='</div>';
      html+=`<div class="week-group"><div class="week-title-bar">الأسبوع ${weekNum} — ${wStart} → ${wEnd}</div>`;
    }
    const date=getDay(i);
    const isToday=i===tIdx;
    const isDone=isDayDone(i);
    const doneCount=getDayDoneCount(i);
    const total=getDayTotal(i);
    let cls='plan-row';
    const isMissed=isMissedDay(i);
    if(isDone)cls+=' done-row';
    else if(isToday)cls+=' today-row';
    else if(isMissed)cls+=' missed-row';
    else if(day.type==='mock')cls+=' mock-row';
    else if(day.type==='rest')cls+=' rest-row';
    else if(day.type==='exam')cls+=' exam-row';
    const color=getTypeColor(day.type);
    const check=isDone?'✅':(isToday?'👉':(doneCount>0?`${doneCount}/${total}`:''));
    html+=`<div class="${cls}" onclick="selectDay(${i})">
      <div class="plan-day-num">${date.getDate()}</div>
      <div class="plan-info">
        <div class="plan-title">${day.title}</div>
        <div class="plan-date">${DAYS_NAMES[date.getDay()]} ${formatDate(date)} ${isToday?'← اليوم':''}</div>
      </div>
${day.type==='exam'?`<span class="plan-type-tag" style="background:${color}20;color:${color};border:1px solid ${color}30">امتحان 🏆</span>`:''}
      <div class="plan-check">${check}</div>
    </div>`;
  });
  html+='</div>';
  container.innerHTML=html;
}

function init() {
  try {
    renderProgress();
    renderCalStrip();
    renderPlanList();
    selectDay(todayIndex());
  } catch(e) { console.log('Init error:',e.message); }
}

init();
</script>
